{% extends "base.html" %}

{% block title %}Photon — Checklists{% endblock %}

{% block styles %}
<style>
    .checklist-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
    }
    .checklist-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.07);
        text-decoration: none;
        color: #1a237e;
        display: flex;
        align-items: center;
        padding: 1.25rem 1.5rem;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: -0.3px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .checklist-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(26,35,126,0.12);
        color: #3949ab;
    }
    .checklist-card .icon {
        font-size: 1.4rem;
        margin-right: 0.75rem;
        flex-shrink: 0;
    }
    .page-header {
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        padding: 2rem;
        margin-bottom: 0.5rem;
    }
    .page-header p {
        margin-bottom: 0;
        color: #546e7a;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="page-header">
                <h1>Checklists</h1>
                <p>On-water reference for maneuvers, trim, and procedures.</p>
            </div>

            <div class="checklist-grid">
                {% for item in checklists %}
                <a href="/checklists/{{ item.slug }}" class="checklist-card">
                    <span class="icon">☑</span>
                    {{ item.title }}
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
